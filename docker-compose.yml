services:
  livepeer-dkg-iteration-lab:
    build: .
    container_name: livepeer-dkg-iteration-lab
    ports:
      - "8787:8080"
    env_file:
      - .env
    volumes:
      - iteration-lab-data:/app/data
      - iteration-lab-dkg-home:/dkg-home
    restart: unless-stopped

volumes:
  iteration-lab-data:
  iteration-lab-dkg-home:
    name: iteration-lab-dkg-home
